<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ECEFF1"/>
    </pattern>
    
    <!-- Arrowheads -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E88E5" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43A047" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78909C" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00BCD4" />
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E91E63" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9C27B0" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC107" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Main Title -->
  <rect x="400" y="20" width="400" height="45" rx="8" fill="#1E88E5" filter="url(#shadow)"/>
  <text x="600" y="50" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">System Architecture &amp; Execution Pipeline</text>

  <!-- ==================== TIER 1: PRESENTATION LAYER ==================== -->
  <rect x="50" y="100" width="260" height="330" rx="12" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="100" width="260" height="40" rx="12" fill="#1E88E5" />
  <rect x="50" y="120" width="260" height="20" fill="#1E88E5" />
  <text x="180" y="126" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Presentation Layer (React 18)</text>

  <rect x="70" y="160" width="220" height="50" rx="6" fill="#ffffff" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="180" y="182" font-size="14" font-weight="bold" fill="#1565C0" text-anchor="middle">Admin CyberDeck</text>
  <text x="180" y="200" font-size="12" fill="#555" text-anchor="middle">Live Attack Console &amp; Telemetry</text>

  <rect x="70" y="220" width="220" height="50" rx="6" fill="#ffffff" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="180" y="242" font-size="14" font-weight="bold" fill="#1565C0" text-anchor="middle">Alice's Interface</text>
  <text x="180" y="260" font-size="12" fill="#555" text-anchor="middle">Document Upload &amp; Signing</text>

  <rect x="70" y="280" width="220" height="50" rx="6" fill="#ffffff" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="180" y="302" font-size="14" font-weight="bold" fill="#1565C0" text-anchor="middle">Bob's Interface</text>
  <text x="180" y="320" font-size="12" fill="#555" text-anchor="middle">Signature Receipt &amp; Correction</text>

  <rect x="70" y="340" width="220" height="50" rx="6" fill="#ffffff" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="180" y="362" font-size="14" font-weight="bold" fill="#1565C0" text-anchor="middle">Charlie's Interface</text>
  <text x="180" y="380" font-size="12" fill="#555" text-anchor="middle">Verification &amp; Hardware Audit</text>

  <!-- Connection: Presentation -> Control Plane -->
  <path d="M 310 200 L 415 200" stroke="#1E88E5" stroke-width="3" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  <text x="362" y="185" font-size="12" font-weight="bold" fill="#1565C0" text-anchor="middle">JSON / WSS</text>
  <text x="362" y="218" font-size="11" fill="#555" text-anchor="middle">Real-time Telemetry</text>


  <!-- ==================== TIER 2: CONTROL PLANE ==================== -->
  <rect x="430" y="100" width="320" height="330" rx="12" fill="#E8F5E9" stroke="#43A047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="100" width="320" height="40" rx="12" fill="#43A047" />
  <rect x="430" y="120" width="320" height="20" fill="#43A047" />
  <text x="590" y="126" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Classical Control Plane (Node.js)</text>

  <rect x="450" y="160" width="280" height="50" rx="6" fill="#ffffff" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="590" y="182" font-size="14" font-weight="bold" fill="#2E7D32" text-anchor="middle">WebSocket Connection Manager</text>
  <text x="590" y="200" font-size="12" fill="#555" text-anchor="middle">Full-Duplex Telemetry Streaming</text>

  <rect x="450" y="220" width="280" height="50" rx="6" fill="#ffffff" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="590" y="242" font-size="14" font-weight="bold" fill="#2E7D32" text-anchor="middle">Wegman-Carter Authenticator</text>
  <text x="590" y="260" font-size="12" fill="#555" text-anchor="middle">Information-Theoretic MAC Verification</text>

  <rect x="450" y="280" width="280" height="50" rx="6" fill="#ffffff" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="590" y="302" font-size="14" font-weight="bold" fill="#2E7D32" text-anchor="middle">Traffic Anomaly Detector</text>
  <text x="590" y="320" font-size="12" fill="#555" text-anchor="middle">Replay, Burst &amp; Spoofing Prevention</text>

  <rect x="450" y="340" width="280" height="50" rx="6" fill="#ffffff" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="590" y="362" font-size="14" font-weight="bold" fill="#2E7D32" text-anchor="middle">Process Spawner &amp; I/O Bridge</text>
  <text x="590" y="380" font-size="12" fill="#555" text-anchor="middle">Child Process Inter-Communication</text>

  <!-- Connection: Control Plane -> Physics Engine -->
  <path d="M 750 200 L 835 200" stroke="#43A047" stroke-width="3" marker-end="url(#arrow-green)" marker-start="url(#arrow-green)"/>
  <text x="792" y="185" font-size="12" font-weight="bold" fill="#2E7D32" text-anchor="middle">STDIO Pipes</text>
  <text x="792" y="218" font-size="11" fill="#555" text-anchor="middle">CLI Args &amp; Results</text>

  <!-- Connection: Control Plane -> Ledger -->
  <path d="M 590 430 L 590 455" stroke="#78909C" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="665" y="448" font-size="12" font-weight="bold" fill="#78909C" text-anchor="middle">Immutable Appends</text>


  <!-- ==================== TIER 3: DATABASE ==================== -->
  <path d="M 490 470 A 100 20 0 0 0 690 470 L 690 540 A 100 20 0 0 1 490 540 Z" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="590" cy="470" rx="100" ry="20" fill="#E1BEE7" stroke="#8E24AA" stroke-width="2"/>
  <text x="590" y="505" font-size="14" font-weight="bold" fill="#4A148C" text-anchor="middle">Merkle Audit Ledger</text>
  <text x="590" y="525" font-size="12" fill="#555" text-anchor="middle">Tamper-Evident Storage Disk</text>


  <!-- ==================== TIER 4: PHYSICS ENGINE ==================== -->
  <rect x="850" y="100" width="300" height="390" rx="12" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="850" y="100" width="300" height="40" rx="12" fill="#F57C00" />
  <rect x="850" y="120" width="300" height="20" fill="#F57C00" />
  <text x="1000" y="126" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Quantum Physics Engine (C++17)</text>

  <rect x="870" y="160" width="260" height="50" rx="6" fill="#ffffff" stroke="#FFCC80" stroke-width="1.5"/>
  <text x="1000" y="182" font-size="14" font-weight="bold" fill="#E65100" text-anchor="middle">Eigen3 Linear Math Core</text>
  <text x="1000" y="200" font-size="12" fill="#555" text-anchor="middle">High-Performance State Vectors</text>

  <rect x="870" y="220" width="260" height="50" rx="6" fill="#ffffff" stroke="#FFCC80" stroke-width="1.5"/>
  <text x="1000" y="242" font-size="14" font-weight="bold" fill="#E65100" text-anchor="middle">GHZ Entanglement Generator</text>
  <text x="1000" y="260" font-size="12" fill="#555" text-anchor="middle">Pre-Shared Resource Allocation</text>

  <rect x="870" y="280" width="260" height="50" rx="6" fill="#ffffff" stroke="#FFCC80" stroke-width="1.5"/>
  <text x="1000" y="302" font-size="14" font-weight="bold" fill="#E65100" text-anchor="middle">Pauli Projective Measurements</text>
  <text x="1000" y="320" font-size="12" fill="#555" text-anchor="middle">Memory-Free Basis Evaluation</text>

  <rect x="870" y="340" width="260" height="50" rx="6" fill="#ffffff" stroke="#FFCC80" stroke-width="1.5"/>
  <text x="1000" y="362" font-size="14" font-weight="bold" fill="#E65100" text-anchor="middle">Hoeffding &amp; CEFB Bounds</text>
  <text x="1000" y="380" font-size="12" fill="#555" text-anchor="middle">Live Statistical Epsilon Tracking</text>

  <rect x="870" y="400" width="260" height="50" rx="6" fill="#ffffff" stroke="#FFCC80" stroke-width="1.5"/>
  <text x="1000" y="422" font-size="14" font-weight="bold" fill="#E65100" text-anchor="middle">Mermin Hardware Simulator</text>
  <text x="1000" y="440" font-size="12" fill="#555" text-anchor="middle">Detector Blinding Self-Tests</text>


  <!-- ==================== PROTOCOL EXECUTION WORKFLOW ==================== -->
  <rect x="400" y="580" width="400" height="35" rx="6" fill="#FBC02D" filter="url(#shadow)"/>
  <text x="600" y="604" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">End-to-End Quantum Protocol Workflow</text>

  <!-- Phase 1 -->
  <text x="170" y="670" font-size="16" font-weight="bold" fill="#00838F" text-anchor="end">Phase 1: Setup</text>
  <rect x="200" y="640" width="240" height="45" rx="22" fill="#E0F7FA" stroke="#00BCD4" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="667" font-size="13" font-weight="bold" fill="#006064" text-anchor="middle">GHZ Entanglement Distribution</text>

  <path d="M 440 662 L 500 662" stroke="#00BCD4" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <rect x="510" y="640" width="220" height="45" rx="22" fill="#E0F7FA" stroke="#00BCD4" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="667" font-size="13" font-weight="bold" fill="#006064" text-anchor="middle">Decoy State Injection</text>

  <path d="M 730 662 L 790 662" stroke="#00BCD4" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <rect x="800" y="640" width="240" height="45" rx="22" fill="#E0F7FA" stroke="#00BCD4" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="667" font-size="13" font-weight="bold" fill="#006064" text-anchor="middle">Mermin Hardware Self-Test</text>

  <!-- Phase 2 -->
  <text x="170" y="750" font-size="16" font-weight="bold" fill="#AD1457" text-anchor="end">Phase 2: Signing</text>
  <rect x="200" y="720" width="240" height="45" rx="22" fill="#FCE4EC" stroke="#E91E63" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="747" font-size="13" font-weight="bold" fill="#880E4F" text-anchor="middle">SHA-256 Document Hashing</text>

  <path d="M 440 742 L 500 742" stroke="#E91E63" stroke-width="2" marker-end="url(#arrow-pink)"/>

  <rect x="510" y="720" width="220" height="45" rx="22" fill="#FCE4EC" stroke="#E91E63" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="747" font-size="13" font-weight="bold" fill="#880E4F" text-anchor="middle">Joint Bell Measurement</text>

  <path d="M 730 742 L 790 742" stroke="#E91E63" stroke-width="2" marker-end="url(#arrow-pink)"/>

  <rect x="800" y="720" width="240" height="45" rx="22" fill="#FCE4EC" stroke="#E91E63" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="747" font-size="13" font-weight="bold" fill="#880E4F" text-anchor="middle">2-Bit Classical Broadcast</text>

  <!-- Phase 3 -->
  <text x="170" y="830" font-size="16" font-weight="bold" fill="#6A1B9A" text-anchor="end">Phase 3: Verify</text>
  <rect x="200" y="800" width="240" height="45" rx="22" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="827" font-size="13" font-weight="bold" fill="#4A148C" text-anchor="middle">Pauli Error Correction</text>

  <path d="M 440 822 L 500 822" stroke="#9C27B0" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <rect x="510" y="800" width="220" height="45" rx="22" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="827" font-size="13" font-weight="bold" fill="#4A148C" text-anchor="middle">Basis Reconciliation</text>

  <path d="M 730 822 L 790 822" stroke="#9C27B0" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <rect x="800" y="800" width="240" height="45" rx="22" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="827" font-size="13" font-weight="bold" fill="#4A148C" text-anchor="middle">CEFB Threshold Checking</text>

  <!-- Phase 4 -->
  <text x="170" y="910" font-size="16" font-weight="bold" fill="#F57F17" text-anchor="end">Phase 4: Audit</text>
  <rect x="200" y="880" width="240" height="45" rx="22" fill="#FFF8E1" stroke="#FFC107" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="907" font-size="13" font-weight="bold" fill="#FF8F00" text-anchor="middle">Live QBER &amp; FP/FN Telemetry</text>

  <path d="M 440 902 L 500 902" stroke="#FFC107" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <rect x="510" y="880" width="220" height="45" rx="22" fill="#FFF8E1" stroke="#FFC107" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="907" font-size="13" font-weight="bold" fill="#FF8F00" text-anchor="middle">Control Layer Threat Tracking</text>

  <path d="M 730 902 L 790 902" stroke="#FFC107" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <rect x="800" y="880" width="240" height="45" rx="22" fill="#FFF8E1" stroke="#FFC107" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="907" font-size="13" font-weight="bold" fill="#FF8F00" text-anchor="middle">Tamper-Evident Ledger Commit</text>

</svg>
